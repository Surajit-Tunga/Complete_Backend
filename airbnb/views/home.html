<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Airbnb</title>
  <link rel="stylesheet" href="/output.css" />
</head>
<body class="min-h-screen bg-gray-100">

  <!-- Header -->
  <header class="bg-white shadow-md py-6 px-8">
    <h1 class="text-3xl font-bold text-red-600">Welcome to Airbnb</h1>
  </header>

  <!-- Centered Add Home Box -->
  <main class="flex items-center justify-center h-[80vh]">
    <div class="bg-white p-10 rounded-2xl shadow-lg text-center">
      <h2 class="text-xl font-semibold text-gray-700 mb-4">Host your place today</h2>
      <a 
        href="/host/add-home" 
        class="inline-block px-6 py-3 bg-red-500 text-white font-medium rounded-md shadow-md hover:bg-red-600 transition duration-300"
      >
        Add Home
      </a>
    </div>
  </main>

</body>
</html>
